<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="universal-agent-bot-hub-title universal-agent-bot-hub-desc" id="architecture-root"><title id="universal-agent-bot-hub-title">Agent Bot Hub | Durable work, deliberate delivery</title><desc id="universal-agent-bot-hub-desc">AUTHORIZED INGRESS TO WORK. TRANSACTIONAL COMPLETION TO DELIVERY. Telegram ingress: Allowlisted users, chats, and identity. Durable queue: Conversation order, leases, fencing. Codex worker: Bounded child-process execution. Transactional completion: History and replies stored together. Durable reply outbox: Delivery is separate from inference. Telegram delivery: Ambiguous sends stop for review. Tests use controlled transports and PGlite. Live credentials, provider calls, and independent PostgreSQL need separate checks.</desc>
