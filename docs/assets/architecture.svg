<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="hub-title hub-desc">


  <title id="hub-title">Agent Bot Hub — durable request and reply sequence</title>


  <desc id="hub-desc">An authorized Telegram update is persisted in PostgreSQL. A worker claims the job, invokes Codex, and stores the history and outgoing reply together. Outbox delivery then sends the reply. Unknown send outcomes require an operator decision, not an automatic resend.</desc>


  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#bcc6d3"/>
    </marker>
    <marker id="success" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#f08a59"/>
    </marker>
  </defs>


  <rect width="900" height="620" rx="12" fill="#101722"/>


  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#f3f1e9}.label{font-size:16px;fill:#bcc6d3}.actor{font-size:19px;font-weight:600}.note{font-size:15px;fill:#bcc6d3}</style>


  <text x="36" y="40" font-size="12" letter-spacing="2" fill="#bcc6d3">REQUEST → DURABLE WORK → DELIVERY</text>


  <text x="36" y="78" font-size="29" font-weight="600">A reply is stored before it is sent.</text>


  <text x="36" y="106" class="label">Implemented PostgreSQL path · time flows downward</text>


  <line x1="120" y1="174" x2="120" y2="542" stroke="#bcc6d3" stroke-opacity="0.45" stroke-dasharray="4 5"/>


  <rect x="36" y="136" width="168" height="44" rx="7" fill="#1a2636" stroke="#bcc6d3"/>
  <text x="120" y="164" class="actor" text-anchor="middle">Telegram</text>


  <line x1="340" y1="174" x2="340" y2="542" stroke="#bcc6d3" stroke-opacity="0.45" stroke-dasharray="4 5"/>


  <rect x="256" y="136" width="168" height="44" rx="7" fill="#1a2636" stroke="#bcc6d3"/>
  <text x="340" y="164" class="actor" text-anchor="middle">Hub / worker</text>


  <line x1="570" y1="174" x2="570" y2="542" stroke="#bcc6d3" stroke-opacity="0.45" stroke-dasharray="4 5"/>


  <rect x="486" y="136" width="168" height="44" rx="7" fill="#1a2636" stroke="#bcc6d3"/>
  <text x="570" y="164" class="actor" text-anchor="middle">PostgreSQL</text>


  <line x1="790" y1="174" x2="790" y2="542" stroke="#bcc6d3" stroke-opacity="0.45" stroke-dasharray="4 5"/>


  <rect x="706" y="136" width="168" height="44" rx="7" fill="#1a2636" stroke="#bcc6d3"/>
  <text x="790" y="164" class="actor" text-anchor="middle">Codex CLI</text>


  <rect x="335" y="204" width="10" height="326" fill="#1a2636" stroke="#bcc6d3"/>
  <rect x="785" y="334" width="10" height="48" fill="#1a2636" stroke="#bcc6d3"/>


  <line x1="120" y1="216" x2="335" y2="216" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#arrow)"/>


  <rect x="137.5" y="189" width="180.0" height="22" rx="3" fill="#101722"/>
  <text x="227.5" y="205" class="label" text-anchor="middle">1  Authorized update</text>


  <line x1="345" y1="270" x2="570" y2="270" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#arrow)"/>


  <rect x="350.9" y="243" width="213.20000000000002" height="22" rx="3" fill="#101722"/>
  <text x="457.5" y="259" class="label" text-anchor="middle">2  Persist + deduplicate</text>


  <line x1="570" y1="322" x2="345" y2="322" stroke="#bcc6d3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>


  <rect x="371.65" y="295" width="171.70000000000002" height="22" rx="3" fill="#101722"/>
  <text x="457.5" y="311" class="label" text-anchor="middle">3  Fenced job lease</text>


  <line x1="345" y1="370" x2="785" y2="370" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#arrow)"/>


  <rect x="545.0" y="343" width="180.0" height="22" rx="3" fill="#101722"/>
  <text x="635" y="359" class="label" text-anchor="middle">4  Bounded model run</text>


  <line x1="785" y1="418" x2="345" y2="418" stroke="#bcc6d3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>


  <rect x="635.65" y="391" width="88.7" height="22" rx="3" fill="#101722"/>
  <text x="680" y="407" class="label" text-anchor="middle">5  Result</text>


  <line x1="345" y1="472" x2="570" y2="472" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#arrow)"/>


  <rect x="342.6" y="445" width="229.8" height="22" rx="3" fill="#101722"/>
  <text x="457.5" y="461" class="label" text-anchor="middle">6  History + outbox commit</text>


  <line x1="335" y1="528" x2="120" y2="528" stroke="#f08a59" stroke-width="1.8" marker-end="url(#success)"/>


  <rect x="137.5" y="501" width="180.0" height="22" rx="3" fill="#101722"/>
  <text x="227.5" y="517" class="label" text-anchor="middle">7  Send stored reply</text>


  <path d="M36 562 H864" stroke="#bcc6d3" stroke-opacity="0.25"/>
  <text x="36" y="587" class="note">Delivery ambiguity → mark uncertain → operator decides. No blind resend.</text>
  <text x="36" y="609" class="note">Source: src/postgres.js · src/worker.js · src/gateway.js · src/codex-runner.js</text>
</svg>
