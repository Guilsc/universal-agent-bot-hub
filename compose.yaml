services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hub_postgres:
